<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#ffffff">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="モーグルDB">
<link rel="apple-touch-icon" sizes="180x180" href="apple-touch-icon.png">
<meta name="robots" content="noindex,nofollow">
<title>選手 | モーグル リザルトデータベース</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<main id="app">
  <div class="card" id="search-card">
    <h2>選手を探す</h2>
    <div class="controls">
      <label>選手名（部分一致。漢字・かなの別名でも可）
        <input type="search" id="q" autocomplete="off" placeholder="例：HORISHIMA、堀島">
      </label>
    </div>
    <div id="results"></div>
  </div>

  <div class="card" id="athlete-card" hidden>
    <p class="meta"><a href="athlete.html">← 選手を探す</a></p>
    <div id="profile"></div>
  </div>

  <div class="card" id="history-card" hidden>
    <h2>出場履歴</h2>
    <p class="meta">新しい順。ラウンド名を押すと、そのラウンドの結果表へ移動します。</p>
    <div id="history"></div>
  </div>

  <div class="card" id="breakdown-card" hidden>
    <h2>ランの内訳と上のラインとの差</h2>
    <p class="meta">各ランを、同じラウンドの通過ライン（最下位通過者）と優勝者に対して、タイム点・エア・ターン（ベース／減点）に分けて比べます。差は「このラン − 相手」です。</p>
    <div id="breakdown"></div>
  </div>

  <div class="card" id="jumps-card" hidden>
    <h2>ジャンプ構成の推移</h2>
    <p class="meta">ジャンプコード・DD・実施点（J6/J7 の平均）を時系列で並べています。</p>
    <div id="jumps"></div>
  </div>
</main>
<script type="module" src="js/athlete.js"></script>
</body>
</html>
